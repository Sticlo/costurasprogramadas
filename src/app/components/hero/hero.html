<section class="hero" aria-labelledby="hero-brand">
  <div class="hero__atmosphere" aria-hidden="true"></div>
  <div class="hero__visual" aria-hidden="true">
    <img
      class="hero__machine"
      src="/assets/hero-maquina-premium.jpg"
      alt=""
      width="1064"
      height="1152"
      decoding="async"
      fetchpriority="high"
    />
  </div>

  <div class="hero__inner">
    <div class="hero__copy">
      <p class="hero__eyebrow">Desde La Alquería · Bogotá</p>
      <p class="hero__brand" id="hero-brand">Costuras Programadas</p>
      <div class="hero__rule" aria-hidden="true"></div>
      <div class="hero__message">
        <h1 class="hero__title">
          Máquinas para su taller.
          <span>Con asesoría clara y cercana.</span>
        </h1>
        <p class="hero__lead">
          Máquinas de coser industriales y familiares, con orientación sencilla para elegir bien.
        </p>
      </div>
      <div class="hero__actions">
        <a class="hero__btn hero__btn--primary" routerLink="/catalogo">Ver catálogo</a>
        <a
          class="hero__btn hero__btn--ghost"
          [href]="whatsapp"
          target="_blank"
          rel="noopener noreferrer"
        >
          WhatsApp
        </a>
      </div>
    </div>
  </div>
</section>
