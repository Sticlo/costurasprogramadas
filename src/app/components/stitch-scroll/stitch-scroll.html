<section class="stitch" aria-labelledby="stitch-title">
  <div class="stitch__sticky">
    <div class="stitch__open-bg" aria-hidden="true">
      <p class="stitch__open-label">Aquí está el catálogo</p>
    </div>

    <div class="stitch__door stitch__door--top" aria-hidden="true"></div>
    <div class="stitch__door stitch__door--bottom" aria-hidden="true"></div>

    <div class="stitch__stage">
      <div class="stitch__fabric" aria-hidden="true">
        <div class="stitch__grain"></div>
        <svg class="stitch__seam" viewBox="0 0 1200 260" preserveAspectRatio="none">
          <defs>
            <mask id="cp-seam-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="260">
              <path
                class="stitch__mask"
                d="M60 150 C235 134 390 166 560 148 C745 130 925 141 1140 152"
              />
            </mask>
          </defs>
          <path
            class="stitch__track"
            d="M60 150 C235 134 390 166 560 148 C745 130 925 141 1140 152"
          />
          <path
            class="stitch__guide"
            d="M60 150 C235 134 390 166 560 148 C745 130 925 141 1140 152"
          />
          <path
            class="stitch__thread"
            mask="url(#cp-seam-reveal)"
            d="M60 150 C235 134 390 166 560 148 C745 130 925 141 1140 152"
          />
        </svg>

        <div class="stitch__needle">
          <div class="stitch__needle-housing"></div>
          <div class="stitch__needle-clamp"></div>
          <div class="stitch__needle-bar"></div>
          <div class="stitch__needle-eye"></div>
          <div class="stitch__needle-point"></div>
          <div class="stitch__presser"></div>
          <div class="stitch__thread-tail"></div>
          <div class="stitch__tip-glow"></div>
        </div>
      </div>

      <div class="stitch__copy">
        <p class="stitch__eyebrow">Precisión en movimiento</p>
        <h2 id="stitch-title">Cada avance deja una puntada.</h2>
        <p>
          Baje con calma para ver cómo se cose la línea. Al terminar, se abre el catálogo de
          productos.
        </p>
        <span class="stitch__scroll-cue" aria-hidden="true">
          <span></span>
          Siga bajando
        </span>
      </div>

      <div class="stitch__counter" aria-hidden="true">
        <span>PROGRESO DE COSTURA</span>
        <div class="stitch__meter"><i></i></div>
      </div>
    </div>

    <div class="stitch__split-glow" aria-hidden="true"></div>
  </div>
</section>
