<div class="fab">
  @if (panelOpen()) {
    <aside class="fab__panel" aria-label="Ayuda para elegir máquina">
      <header class="fab__panel-head">
        <div>
          <p class="fab__panel-kicker">Ayuda rápida</p>
          <h2 class="fab__panel-title">¿Qué necesita?</h2>
        </div>
        <button type="button" class="fab__panel-close" aria-label="Cerrar" (click)="closePanel()">
          ×
        </button>
      </header>

      <p class="fab__panel-lead">
        Toque una opción y le abrimos WhatsApp con el mensaje listo para nuestro equipo.
      </p>

      <ul class="fab__prompts">
        @for (prompt of quickPrompts; track prompt) {
          <li>
            <button type="button" class="fab__prompt" (click)="askAi(prompt)">
              {{ prompt }}
            </button>
          </li>
        }
      </ul>

      <a class="fab__panel-cta" [href]="whatsapp" target="_blank" rel="noopener noreferrer">
        Ir directo a WhatsApp · {{ phone }}
      </a>
    </aside>
  }

  <div class="fab__stack" role="group" aria-label="Contacto rápido">
    <button
      type="button"
      class="fab__btn fab__btn--ai"
      [attr.aria-expanded]="panelOpen()"
      aria-label="Abrir ayuda para elegir máquina"
      (click)="openAiPanel()"
    >
      <span class="fab__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
          <path
            d="M12 3.5c-2.8 0-5 2-5 4.6 0 1.5.7 2.8 1.8 3.6L7.5 16.5h9l-1.3-4.8c1.1-.8 1.8-2.1 1.8-3.6 0-2.6-2.2-4.6-5-4.6Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <path d="M9.2 19.2h5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="9.2" cy="8.2" r="0.9" fill="currentColor" />
          <circle cx="14.8" cy="8.2" r="0.9" fill="currentColor" />
        </svg>
      </span>
      <span class="fab__text">Ayuda</span>
    </button>

    <a
      class="fab__btn fab__btn--wa"
      [href]="whatsapp"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Escribir por WhatsApp al {{ phone }}"
    >
      <span class="fab__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path
            d="M12.04 2.1A9.9 9.9 0 0 0 2.1 12c0 1.75.46 3.45 1.34 4.95L2 22l5.2-1.36A9.9 9.9 0 0 0 12.04 22 9.9 9.9 0 0 0 22 12.1 9.9 9.9 0 0 0 12.04 2.1Zm0 18.1a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.08.81.82-3-.2-.31A8.18 8.18 0 1 1 12.04 20.2Zm4.5-6.13c-.25-.12-1.46-.72-1.68-.8-.23-.08-.4-.12-.56.12-.17.25-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.42h-.48c-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07s.89 2.4 1.02 2.56c.12.17 1.75 2.67 4.24 3.74 1.49.64 2.07.7 2.82.59.43-.07 1.46-.6 1.67-1.17.2-.58.2-1.07.14-1.17-.06-.1-.23-.16-.48-.29Z"
          />
        </svg>
      </span>
      <span class="fab__text">WhatsApp</span>
    </a>
  </div>
</div>
