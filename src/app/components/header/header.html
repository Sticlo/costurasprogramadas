<header
  class="header"
  [class.header--scrolled]="scrolled()"
  [class.header--open]="menuOpen()"
  [class.header--on-hero]="isHome() && !scrolled()"
>
  <div class="header__inner">
    <a class="header__brand" routerLink="/" (click)="closeMenu()" aria-label="Costuras Programadas">
      <img
        class="header__logo header__logo--light"
        src="/assets/logo-nav-light.png"
        alt="Costuras Programadas"
        width="112"
        height="112"
        decoding="async"
      />
      <img
        class="header__logo header__logo--dark"
        src="/assets/logo-nav-dark.png"
        alt=""
        width="112"
        height="112"
        decoding="async"
        aria-hidden="true"
      />
    </a>

    <nav class="header__nav" [class.header__nav--open]="menuOpen()" aria-label="Principal">
      @for (link of links; track link.label) {
        <a
          class="header__link"
          [routerLink]="link.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
      <a class="header__cta" routerLink="/catalogo" (click)="closeMenu()">
        Ver catálogo
      </a>
    </nav>

    <button
      class="header__backdrop"
      type="button"
      aria-label="Cerrar menú"
      [attr.aria-hidden]="!menuOpen()"
      (click)="closeMenu()"
    ></button>

    <button
      class="header__toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
